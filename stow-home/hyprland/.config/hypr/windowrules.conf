windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = float, class:^(Rofi|blueman-manager|nm-connection-editor|org.gnome.FileRoller|org.pulseaudio.pavucontrol)$
windowrulev2 = center, floating:1

windowrulev2 = float, title:^(float-term)$
windowrulev2 = size 630 350, title:^(float-term)$

windowrulev2 = stayfocused, class:(Rofi)$
windowrulev2 = center, floating:1, class:(Rofi)$
